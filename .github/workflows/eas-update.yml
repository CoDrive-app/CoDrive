name: EAS Update Preview

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Publish Expo Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Change to 'yarn' or 'pnpm' if you don't use npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish preview update
        run: eas update --branch preview --environment preview --message "${{ github.event.head_commit.message }}" --non-interactive